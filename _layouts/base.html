<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: "TMB Ltd | Fencing for Agricultural & Commercial Properties" }}</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@700&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style id="dark-mode-init">
    html.dark-mode-init .card,
    html.dark-mode-init .form-input,
    html.dark-mode-init .btn--ghost-light {
      background: #0A0A0A !important;
      border-color: rgba(255, 255, 255, 0.1) !important;
      color: #F1F5F9 !important;
    }
    html.dark-mode-init .btn--ghost-light {
      background: transparent !important;
      border-color: rgba(255, 255, 255, 0.4) !important;
      color: #fff !important;
    }
    html.dark-mode-init .header {
      background: #0A0A0A !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
    }
  </style>
  <script>
    (function() {
      const defaultTheme = 'light';
      const businessName = 'TMB Ltd';
      const storageKey = 'siteTheme_' + businessName.replace(/[^a-zA-Z0-9]/g, '_');
      const isPreview = window.location.pathname.includes('/websites/');
      let savedMode = localStorage.getItem(storageKey);
      if (isPreview && savedMode !== null) {
        localStorage.removeItem(storageKey);
        savedMode = null;
      }
      let activeMode = defaultTheme;
      if (savedMode !== null) {
        activeMode = savedMode;
      } else {
        if (!isPreview) {
          localStorage.setItem(storageKey, activeMode);
        }
      }
      if (activeMode === 'dark') {
        document.documentElement.classList.add('dark-mode');
        document.documentElement.classList.add('dark-mode-init');
      } else if (activeMode === 'color') {
        document.documentElement.classList.add('color-mode');
      }
      if (activeMode === 'dark' || activeMode === 'color') {
        const applyBodyClass = () => {
          if (activeMode === 'dark') document.body.classList.add('dark-mode');
          if (activeMode === 'color') document.body.classList.add('color-mode');
        };
        if (document.body) {
          applyBodyClass();
        } else {
          document.addEventListener('DOMContentLoaded', applyBodyClass);
        }
      }
    })();
  </script>
</head>
<body class="hide-image-box-effect">

{% include header.html %}

{{ content }}

{% include footer.html %}

</body>
</html>
