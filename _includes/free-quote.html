  <!-- Pre-Footer Section -->
  <section class="section section--prefooter" id="quote">
    <div class="container">
      <div class="section__header section__header--center">
        <div>
          <p class="h-eyebrow">CONTACT US</p>
          <h2 class="h2">Get A Free Quote</h2>
          <p class="section__description">Fill out the form below and we'll get back to you with a competitive quote.</p>
        </div>
      </div>
      <form class="quote-form" id="quoteForm" action="https://levelled-form-handler.vercel.app/api/submit" method="POST">
        <input type="hidden" name="client_id" value="tmb">
        <input type="hidden" name="business_name" value="TMB">
        <input type="hidden" name="form_timestamp" id="formTimestamp">
        <div class="hp-trap" aria-hidden="true">
          <label for="company-field">Company</label>
          <input type="text" id="company-field" name="company" tabindex="-1" autocomplete="off">
        </div>
        <div class="form-row">
          <input type="text" name="name" placeholder="Full name" class="form-input" required>
          <input type="text" name="postcode" placeholder="Postcode" class="form-input" required>
        </div>
        <div class="form-row">
          <input type="email" name="email" placeholder="Email address" class="form-input" required>
          <input type="tel" name="phone" placeholder="Phone number" class="form-input" required>
        </div>
        <textarea name="message" placeholder="Briefly describe your project" class="form-input form-textarea" maxlength="1000" required></textarea>
        <button type="submit" class="btn btn--primary btn--full">Yes, I Want a Free Quote</button>
        <div class="form-message" id="formMessage"></div>
      </form>
    </div>
  </section>
